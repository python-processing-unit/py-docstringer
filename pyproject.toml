[project]
name = "py-docstringer"
version = "0.1.0"
description = "Add Google-style docstrings to Python files with OpenRouter batch requests."
readme = "README.md"
authors = [
    { name = "python-processing-unit" }
]
requires-python = "==3.15.1"
dependencies = [
    "openrouter==1.3.79",
]

[project.scripts]
add-docstrings = "py_docstringer.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.17.2",
    "ty==0.0.91",
]

[tool.pytest.ini_options]
addopts = "-n auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.15"
